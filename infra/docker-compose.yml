name: ticket-system

services:
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    ports:
      - "18080:18080"
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_SYNCHRONIZE: "true"
      COOKIE_SECURE: "false"
      ENABLE_OPENAPI: "true"
      ALLOW_LOCALHOST_CORS: "true"
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:18080,http://127.0.0.1:18080}
      STAFF_ORIGIN: ${STAFF_ORIGIN:-http://localhost:18080,http://127.0.0.1:18080}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      DATABASE_URL: postgresql://ticket:ticket@postgres:5432/ticket
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-local-docker-secret-change-before-use-1234}
      OIDC_ISSUER: http://localhost:18080/realms/ticket-system
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/ticket-system
      OIDC_CLIENT_ID: ticket-staff
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-replace-in-production}
      OIDC_CALLBACK_URL: http://localhost:18080/api/auth/callback
      STAFF_APP_URL: http://localhost:18080/staff/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ticket
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "56379:6379"
    volumes:
      - redis-data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: change-me
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: http://localhost:18080
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      KC_SPI_THEME_STATIC_MAX_AGE: "-1"
    ports:
      - "18081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - ./keycloak-theme/ticket:/opt/keycloak/themes/ticket:ro

volumes:
  postgres-data:
  redis-data:

