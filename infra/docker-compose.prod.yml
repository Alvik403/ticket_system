name: ticket-system-prod

services:
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        NGINX_CONF: infra/nginx.prod.conf
    ports:
      - "18080:18080"
    mem_limit: 64m
    pids_limit: 50
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      PORT: 3000
      DB_SYNCHRONIZE: "false"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENABLE_OPENAPI: "false"
      ALLOW_LOCALHOST_CORS: ${ALLOW_LOCALHOST_CORS:-true}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-}
      STAFF_ORIGIN: ${STAFF_ORIGIN:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql://ticket:${POSTGRES_PASSWORD}@postgres:5432/ticket
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:18080/realms/ticket-system}
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/ticket-system
      OIDC_CLIENT_ID: ticket-staff
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_CALLBACK_URL: ${OIDC_CALLBACK_URL:-http://localhost:18080/api/auth/callback}
      STAFF_APP_URL: ${STAFF_APP_URL:-http://localhost:18080/staff/}
      RETENTION_TICKET_DAYS: ${RETENTION_TICKET_DAYS:-90}
      RETENTION_AUDIT_DAYS: ${RETENTION_AUDIT_DAYS:-365}
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:3000/api/health/ready",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    mem_limit: 384m
    pids_limit: 100
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ticket
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    pids_limit: 100
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      - redis-server
      - --appendonly
      - "no"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - volatile-lru
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}",
          "--no-auth-warning",
          "ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    pids_limit: 50
    restart: unless-stopped

  keycloak-db-init:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command:
      [
        "psql",
        "-h",
        "postgres",
        "-U",
        "ticket",
        "-d",
        "ticket",
        "-v",
        "ON_ERROR_STOP=1",
        "-c",
        "CREATE SCHEMA IF NOT EXISTS keycloak AUTHORIZATION ticket",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  keycloak:
    build:
      context: ..
      dockerfile: infra/Dockerfile.keycloak
    command: start --optimized --import-realm --http-enabled=true --hostname-strict=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD in .env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/ticket
      KC_DB_USERNAME: ticket
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_SCHEMA: keycloak
      KC_DB_POOL_INITIAL_SIZE: "2"
      KC_DB_POOL_MIN_SIZE: "2"
      KC_DB_POOL_MAX_SIZE: "10"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx384m"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - ./keycloak-theme/ticket:/opt/keycloak/themes/ticket:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec \"exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s
    mem_limit: 700m
    pids_limit: 250
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
