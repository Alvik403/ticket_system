resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_backend {
    zone api_backend 64k;
    server api:3000 resolve;
}

upstream keycloak_backend {
    zone keycloak_backend 64k;
    server keycloak:8080 resolve;
}

server {
    listen 8080;
    listen 18080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = / {
        return 302 /client/;
    }

    location = /client {
        return 302 /client/;
    }

    # Старые сборки Vite с base=/ — скрипты запрашивают /assets/…
    location ^~ /assets/ {
        root /usr/share/nginx/html/client;
        try_files $uri =404;
    }

    location = /favicon.svg {
        alias /usr/share/nginx/html/client/favicon.svg;
    }

    location /client/ {
        try_files $uri $uri/ /client/index.html;
    }

    location = /staff {
        return 302 /staff/;
    }

    location /staff/ {
        try_files $uri $uri/ /staff/index.html;
    }

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /realms/ {
        # Do not inherit the application CSP. Keycloak sends its own
        # nonce-based CSP for login/logout pages.
        add_header X-Content-Type-Options nosniff always;
        proxy_pass http://keycloak_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /resources/ {
        add_header X-Content-Type-Options nosniff always;
        proxy_pass http://keycloak_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        add_header X-Content-Type-Options nosniff always;
        proxy_pass http://keycloak_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

